# Applies the SQL files in supabase/migrations to the production Supabase project.
# Run it from GitHub: Actions → "Database: apply migrations" → Run workflow.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   – the project ref (the id in the dashboard URL)
#   SUPABASE_DB_PASSWORD   – the database password chosen when creating the project
name: "Database: apply migrations"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only list the migrations that would be applied"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: supabase db push --dry-run

      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: supabase db push
